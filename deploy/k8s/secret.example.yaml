# EXAMPLE ONLY — do not apply as-is.
#
# Create the real secret out of band so credentials never enter git, e.g.:
#
#   kubectl -n coding-agent create secret generic coding-agent-secrets \
#     --from-literal=POSTGRES_USER=coding \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=POSTGRES_DB=coding_agent \
#     --from-literal=AUTH_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DATABASE_URL="postgresql+asyncpg://coding:REPLACE@coding-agent-postgres:5432/coding_agent" \
#     --from-literal=LLM_PROVIDER=openai \
#     --from-literal=LLM_MODEL=big-pickle \
#     --from-literal=LLM_BASE_URL=https://opencode.ai/zen/v1 \
#     --from-literal=LLM_API_KEY=REPLACE
#
# For production prefer External Secrets Operator or a sealed-secrets workflow.
apiVersion: v1
kind: Secret
metadata:
  name: coding-agent-secrets
  labels:
    app.kubernetes.io/name: coding-agent
type: Opaque
stringData:
  POSTGRES_USER: "coding"
  POSTGRES_PASSWORD: "change-me"
  POSTGRES_DB: "coding_agent"
  DATABASE_URL: "postgresql+asyncpg://coding:change-me@coding-agent-postgres:5432/coding_agent"
  AUTH_SECRET: "change-me-change-me-change-me-32chars"
  LLM_PROVIDER: "openai"
  LLM_MODEL: "big-pickle"
  LLM_BASE_URL: "https://opencode.ai/zen/v1"
  LLM_API_KEY: ""
