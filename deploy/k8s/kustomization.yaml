apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: coding-agent

# Create the coding-agent-secrets Secret out of band (see secret.example.yaml)
# before applying; it is intentionally not listed here.
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - api.yaml
  - ingress.yaml

# Point this at the image published by the Release workflow, e.g.:
#   kustomize edit set image ghcr.io/your-org/coding-agent=ghcr.io/acme/coding-agent:v1.2.3
images:
  - name: ghcr.io/your-org/coding-agent
    newTag: latest

labels:
  - pairs:
      app.kubernetes.io/part-of: coding-agent
    includeSelectors: false
