apiVersion: v1
kind: Service
metadata:
  name: coding-agent-api
  labels:
    app.kubernetes.io/name: coding-agent
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: coding-agent
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coding-agent-api
  labels:
    app.kubernetes.io/name: coding-agent
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: coding-agent
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coding-agent
        app.kubernetes.io/component: api
    spec:
      initContainers:
        # Apply DB migrations before the new pods start serving traffic.
        - name: migrate
          image: ghcr.io/your-org/coding-agent:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: coding-agent-config
            - secretRef:
                name: coding-agent-secrets
      containers:
        - name: api
          image: ghcr.io/your-org/coding-agent:latest
          command:
            ["uvicorn", "app.gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: coding-agent-config
            - secretRef:
                name: coding-agent-secrets
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # NOTE: terminal/test tools execute inside Docker sandbox containers.
          # In-cluster that needs a container runtime for the pod (Docker socket
          # mount or a dedicated DinD/sidecar). Filesystem and git tools, the
          # LLM loop, retrieval, and MCP all work without it. To enable the
          # sandbox here, mount the host runtime socket, e.g.:
          #   volumeMounts:
          #     - name: docker-sock
          #       mountPath: /var/run/docker.sock
          # volumes:
          #   - name: docker-sock
          #     hostPath:
          #       path: /var/run/docker.sock
          #       type: Socket
